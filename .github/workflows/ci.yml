name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Build C++ core and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S cpp_core -B cpp_core/build

      - name: Build
        run: cmake --build cpp_core/build

      - name: Test
        run: ctest --output-on-failure
        working-directory: cpp_core/build
